[workspace]
resolver = "3"
members = ["crates/romkit", "crates/romkit-cli", "crates/romkit-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/platinvm/romkit"
homepage = "https://platinvm.github.io/romkit/"

[workspace.dependencies]
# Keep the version in step with [workspace.package]: it is what romkit-cli requires on crates.io.
romkit = { path = "crates/romkit", version = "0.1.0" }
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.5.2"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "KHR_materials_unlit"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

# Small binaries: the wasm module is downloaded by every visitor of the website.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

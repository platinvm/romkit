[package]
name = "romkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Identify game ROMs and extract their data and assets as structured files."

[workspace]
members = ["cli"]

[dependencies]
crc32fast = "1.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
